name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # types + lint, unit tests, single-file build, browser suite, backend deck
      - name: Full pipeline
        run: npm run ci
        env:
          CHROME_PATH: google-chrome
